version: "3.9"

services:
  auth:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: authdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  task-service:
    build: ./task-service
    container_name: task-service
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - auth
    env_file:
      - .env

  notify-service:
    build:
      context: ./notify-service
    ports:
      - "8080:8080"
    networks:
      - app-network
volumes:
  db_data:

networks:
  app-network:
    driver: bridge
